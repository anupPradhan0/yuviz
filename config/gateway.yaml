# Addresses and secrets come from .env (CONVERSATION_SVC_TARGET, REDIS_URL,
# FREESWITCH_ESL_*, SIP_PROXY_*); this file only tunes behaviour.
gateway:
  websocket:
    port: 8080
    max_connections: 1000
    timeout_ms: 30000
    metadata_wait_ms: 1500

  timers:
    no_speech_timeout_ms: 60000

  logging:
    level: "debug"
    console: true

  conversation:
    type: "grpc"
    connect_timeout_ms: 5000

  media:
    sample_rate: 16000             # 16 kHz — matches FasterWhisper native rate and TTS output
    channels: 1
    frame_ms: 20
    ring_buffer_ms: 500

  metrics:
    enabled: true
    port: 9090
    path: "/metrics"

  esl:
    # FreeSWITCH Event Socket — lets the gateway hang up the SIP leg when the
    # agent ends the call (marker-driven, see PipelineConversationHandler).
    # Disabled by default: leaving it off just means the SIP call lingers
    # until the caller hangs up manually (today's behavior), not a crash.
    enabled: true
    # password: from FREESWITCH_ESL_PASSWORD in .env — never committed here
    connect_timeout_ms: 2000
    # Every number the Gateway dials — cold transfer AND warm transfer's
    # agent leg — goes out through this SIP proxy/registrar (Kamailio), never
    # a FreeSWITCH dialplan context. The setting is SIP_PROXY_HOST /
    # SIP_PROXY_PORT in .env, which scripts/update_kamailio_ip.sh writes with
    # Kamailio's IP; a non-blank .env value overrides these. This yaml value
    # is only the fallback, and stays empty: with no SIP_PROXY_HOST the
    # Gateway logs an error at startup and refuses transfers to numbers
    # (sip_proxy_host_unset) instead of sending the INVITE to a wrong host.

  redis:
    # Phase 5 config-plane cache — same Redis + key shape services/config/
    # writes to (tenant:{tenant_id}). Disabled by default: TenantConfig::
    # from_redis() degrades to from_default() on any failure, so leaving
    # this off just means every session uses process-level defaults, not a
    # crash or rejected call.
    enabled: true
    connect_timeout_ms: 200
    command_timeout_ms: 100
