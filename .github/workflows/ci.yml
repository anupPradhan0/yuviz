name: CI

on:
  pull_request:
  push:
    branches: [redesign]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg14
        env:
          POSTGRES_USER: postgres
          # "password" is the test suite's own accepted placeholder (tests/test_env_catalogue.py
          # ::_is_placeholder) — any other literal here fails test_no_committed_file_holds_a_credential.
          POSTGRES_PASSWORD: password
          POSTGRES_DB: voiceai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DSN: postgresql://postgres:password@localhost:5432/voiceai
      REDIS_URL: redis://localhost:6379/0
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: password
      JWT_SECRET: ci-only-jwt-secret-not-a-real-credential-0123456789
      # Bump either and the model cache key changes with it.
      OLLAMA_IMAGE: ollama/ollama:0.24.0
      OLLAMA_CI_MODELS: nomic-embed-text qwen2.5:0.5b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          # CPU wheel: the default Linux torch pulls GBs of CUDA libraries the tests never use.
          torch_version="$(sed -n 's/^torch==//p' requirements.txt)"
          test -n "$torch_version"
          pip install --no-cache-dir "torch==${torch_version}" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Apply database schema
        run: |
          psql voiceai -v ON_ERROR_STOP=1 -f database/schema.sql
          psql voiceai -v ON_ERROR_STOP=1 -f database/knowledge_schema.sql
          psql voiceai -v ON_ERROR_STOP=1 -f database/telephony_schema.sql
          psql voiceai -v ON_ERROR_STOP=1 -v yuviz_app_password=testpw -f database/rls.sql

      # libs/vad_sdk resolves models/silero_vad.onnx from the repo root; the test suite
      # has no fallback for a missing file (matches docs/setup.md's own local-setup step).
      - name: Fetch the VAD model
        run: |
          mkdir -p models
          src="$(python -c 'import faster_whisper, pathlib; print(pathlib.Path(faster_whisper.__file__).parent / "assets" / "silero_vad_v6.onnx")')"
          test -f "$src"
          cp "$src" models/silero_vad.onnx

      # tests/test_cross_tenant_admin.py expects this exact seeded account to exist.
      - name: Seed the conversation-service account
        run: python scripts/create_service_account.py conversation-service@internal.yuviz.ai ci-only-password-not-a-real-credential

      # Ollama runs as a step, not a service, so the cached models are on disk before it starts.
      - name: Restore the Ollama models
        id: ollama-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.OLLAMA_IMAGE }}-${{ env.OLLAMA_CI_MODELS }}

      - name: Start Ollama
        run: |
          mkdir -p ~/.ollama/models
          docker run -d --name ollama -p 127.0.0.1:11434:11434 -v "$HOME/.ollama/models:/root/.ollama/models" "$OLLAMA_IMAGE"
          for _ in $(seq 30); do
            curl -sf http://localhost:11434/api/version >/dev/null && exit 0
            sleep 1
          done
          docker logs ollama
          exit 1

      # /api/pull answers 200 even on failure; only a final "success" status means the model landed.
      - name: Pull the Ollama models
        if: steps.ollama-cache.outputs.cache-hit != 'true'
        run: |
          for model in $OLLAMA_CI_MODELS; do
            curl -sf http://localhost:11434/api/pull -X POST -H 'Content-Type: application/json' \
              -d "{\"model\": \"${model}\", \"stream\": false}" | tee /tmp/pull.json
            grep -q '"status":"success"' /tmp/pull.json
          done
          # Ollama writes as root; the cache action runs as the runner user.
          sudo chown -R "$(id -u):$(id -g)" ~/.ollama/models

      - name: Save the Ollama models
        if: steps.ollama-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.ollama/models
          key: ${{ steps.ollama-cache.outputs.cache-primary-key }}

      - name: Check the Ollama models are present
        run: |
          tags="$(curl -sf http://localhost:11434/api/tags)"
          for model in $OLLAMA_CI_MODELS; do
            grep -q "\"name\":\"${model}" <<<"$tags" || { echo "missing Ollama model: ${model}"; exit 1; }
          done

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider -rfEs

  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # tests/config_test.cpp's guarded-lookup test skips without Redis, and a skip fails this job.
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libspdlog-dev \
            libyaml-cpp-dev \
            nlohmann-json3-dev \
            libwebsockets-dev \
            libgtest-dev \
            libhiredis-dev \
            libgrpc++-dev \
            protobuf-compiler-grpc \
            libprotobuf-dev

      # Pin: microsoft/onnxruntime v1.20.1 Linux x64 (matches CMakeLists PATHS under /usr/local).
      - name: Install onnxruntime 1.20.1
        run: |
          curl -fsSL -o /tmp/onnxruntime.tgz \
            https://github.com/microsoft/onnxruntime/releases/download/v1.20.1/onnxruntime-linux-x64-1.20.1.tgz
          echo "67db4dc1561f1e3fd42e619575c82c601ef89849afc7ea85a003abbac1a1a105  /tmp/onnxruntime.tgz" | sha256sum -c -
          tar -xzf /tmp/onnxruntime.tgz -C /tmp
          sudo mkdir -p /usr/local/include/onnxruntime /usr/local/lib
          sudo cp -r /tmp/onnxruntime-linux-x64-1.20.1/include/* /usr/local/include/onnxruntime/
          sudo cp -r /tmp/onnxruntime-linux-x64-1.20.1/lib/* /usr/local/lib/
          sudo ldconfig

      # Tests run from build/tests and look for ../models/silero_vad.onnx; without it they GTEST_SKIP.
      - name: Provision Silero VAD model
        run: |
          fw_version="$(sed -n 's/^faster-whisper==//p' requirements.txt)"
          test -n "$fw_version"
          python3 -m pip download --no-deps "faster-whisper==${fw_version}" -d /tmp/fw
          mkdir -p build/models
          python3 -c "import glob, zipfile; open('build/models/silero_vad.onnx', 'wb').write(zipfile.ZipFile(glob.glob('/tmp/fw/faster_whisper-*.whl')[0]).read('faster_whisper/assets/silero_vad_v6.onnx'))"
          test -s build/models/silero_vad.onnx

      - name: Configure, build, and test
        shell: bash -eo pipefail {0}
        run: |
          # Distro gRPC/protobuf cmake configs live under multiarch paths on Ubuntu.
          export CMAKE_PREFIX_PATH="/usr/lib/x86_64-linux-gnu/cmake:${CMAKE_PREFIX_PATH:-}"
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          ctest --test-dir build --output-on-failure | tee /tmp/ctest.log
          if grep -q '(Skipped)' /tmp/ctest.log; then
            echo "ctest skipped tests; a skipped test is not a pass here"
            exit 1
          fi

  admin-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Build (also type-checks)
        run: npm run build
      - name: Unit tests
        run: npm test

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build service images (no push)
        run: |
          torch_version="$(sed -n 's/^torch==//p' requirements.txt)"
          test -n "$torch_version"
          docker build -f deployment/docker/Dockerfile.python --build-arg TORCH_VERSION="$torch_version" -t yuviz-python:ci .
          docker build -f deployment/docker/Dockerfile.adminui -t yuviz-adminui:ci .

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint

      - name: Lint workflows
        env:
          SHELLCHECK_OPTS: -S warning
        run: actionlint -color

  gate:
    needs: [python-tests, gateway, admin-ui, docker-build, actionlint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate required checks
        run: |
          echo "python-tests=${{ needs.python-tests.result }}"
          echo "gateway=${{ needs.gateway.result }}"
          echo "admin-ui=${{ needs.admin-ui.result }}"
          echo "docker-build=${{ needs.docker-build.result }}"
          echo "actionlint=${{ needs.actionlint.result }}"
          test "${{ needs.python-tests.result }}" = "success"
          test "${{ needs.gateway.result }}" = "success"
          test "${{ needs.admin-ui.result }}" = "success"
          test "${{ needs.docker-build.result }}" = "success"
          test "${{ needs.actionlint.result }}" = "success"
