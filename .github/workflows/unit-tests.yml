name: Unit tests

on:
  pull_request:
  push:
    branches: [redesign, main]

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg14
        env:
          POSTGRES_USER: postgres
          # "password" is the test suite's own accepted placeholder (tests/test_env_catalogue.py
          # ::_is_placeholder) — any other literal here fails test_no_committed_file_holds_a_credential.
          POSTGRES_PASSWORD: password
          POSTGRES_DB: voiceai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      ollama:
        image: ollama/ollama:latest
        ports: ["11434:11434"]
        options: >-
          --health-cmd "ollama list"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      POSTGRES_DSN: postgresql://postgres:password@localhost:5432/voiceai
      REDIS_URL: redis://localhost:6379/0
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: password
      JWT_SECRET: ci-only-jwt-secret-not-a-real-credential-0123456789
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          # CPU wheel: the default Linux torch pulls GBs of CUDA libraries the tests never use.
          pip install "torch==$(grep -oP '^torch==\K.*' requirements.txt)" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Apply database schema
        run: |
          psql voiceai -v ON_ERROR_STOP=1 -f database/schema.sql
          psql voiceai -v ON_ERROR_STOP=1 -f database/knowledge_schema.sql
          psql voiceai -v ON_ERROR_STOP=1 -f database/telephony_schema.sql
          psql voiceai -v ON_ERROR_STOP=1 -v yuviz_app_password=ci-only -f database/rls.sql

      # libs/vad_sdk resolves models/silero_vad.onnx from the repo root; the test suite
      # has no fallback for a missing file (matches docs/setup.md's own local-setup step).
      - name: Fetch the VAD model
        run: |
          mkdir -p models
          cp "$(python -c 'import faster_whisper, os; print(os.path.dirname(faster_whisper.__file__))')/assets/silero_vad_v6.onnx" models/silero_vad.onnx

      # tests/test_cross_tenant_admin.py expects this exact seeded account to exist.
      - name: Seed the conversation-service account
        run: python scripts/create_service_account.py conversation-service@internal.yuviz.ai ci-only-password-not-a-real-credential

      - name: Pull the embedding model
        run: curl -sf http://localhost:11434/api/pull -d '{"model": "nomic-embed-text"}'

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider -rfE

  admin-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint (errors only)
        run: npx eslint . --quiet
      - name: Unit tests
        run: npm test
